<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aleesha Growth · Tu recurso gratuito</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

  :root {
    --blue-deep: #1e3a6e;
    --blue-mid: #2d5fa6;
    --blue-light: #4a7fd4;
    --blue-pale: #dce8f8;
    --accent: #4a7fd4;
    --white: #ffffff;
    --off-white: #f7f9fc;
    --gray-light: #e8eef6;
    --gray-text: #5a6a80;
    --text: #1a2840;
    --green: #2d7a5f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--off-white);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--blue-deep);
    padding: 0;
    position: relative;
    overflow: hidden;
  }

  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 32px 48px;
    position: relative;
    z-index: 2;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 36px;
  }

  .logo-img {
    height: 44px;
    width: auto;
    filter: brightness(0) invert(1);
  }

  .header-bg-circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }
  .hbc1 { width: 400px; height: 400px; top: -150px; right: -100px; }
  .hbc2 { width: 200px; height: 200px; bottom: -80px; left: 60px; }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 4vw, 42px);
    color: var(--white);
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 14px;
  }

  header h1 span {
    color: var(--accent);
  }

  header p {
    color: rgba(255,255,255,0.75);
    font-size: 16px;
    font-weight: 300;
    max-width: 560px;
    line-height: 1.6;
  }

  /* STEPS BAR */
  .steps-bar {
    background: var(--white);
    border-bottom: 1px solid var(--gray-light);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(30,58,110,0.08);
  }

  .steps-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 0;
  }

  .step-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 0;
    flex: 1;
    opacity: 0.4;
    transition: opacity 0.3s;
  }

  .step-item.active { opacity: 1; }
  .step-item.done { opacity: 0.7; }

  .step-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--gray-light);
    color: var(--gray-text);
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.3s;
  }

  .step-item.active .step-num {
    background: var(--blue-mid);
    color: white;
  }

  .step-item.done .step-num {
    background: var(--green);
    color: white;
  }

  .step-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-text);
    white-space: nowrap;
  }

  .step-item.active .step-label { color: var(--blue-deep); }

  .step-sep {
    width: 24px;
    height: 1px;
    background: var(--gray-light);
    flex-shrink: 0;
  }

  /* MAIN */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 48px 32px 80px;
  }

  /* SECTIONS */
  .section {
    display: none;
    animation: fadeUp 0.4s ease both;
  }

  .section.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: var(--blue-deep);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .section-sub {
    color: var(--gray-text);
    font-size: 15px;
    margin-bottom: 32px;
    font-weight: 300;
  }

  /* ROL CARDS */
  .roles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .rol-card {
    border: 2px solid var(--gray-light);
    border-radius: 14px;
    padding: 24px 22px;
    cursor: pointer;
    background: var(--white);
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }

  .rol-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    background: var(--blue-light);
    transform: scaleY(0);
    transition: transform 0.25s;
    transform-origin: bottom;
  }

  .rol-card:hover {
    border-color: var(--blue-light);
    box-shadow: 0 6px 24px rgba(30,58,110,0.1);
    transform: translateY(-2px);
  }

  .rol-card:hover::before { transform: scaleY(1); }

  .rol-card.selected {
    border-color: var(--blue-mid);
    background: var(--blue-pale);
  }

  .rol-card.selected::before { transform: scaleY(1); background: var(--blue-mid); }

  .rol-icon {
    font-size: 28px;
    margin-bottom: 12px;
    display: block;
  }

  .rol-name {
    font-weight: 600;
    font-size: 16px;
    color: var(--blue-deep);
    margin-bottom: 6px;
  }

  .rol-desc {
    font-size: 13px;
    color: var(--gray-text);
    line-height: 1.5;
    font-weight: 300;
  }

  /* PROBLEMAS */
  .problemas-grid {
    display: grid;
    gap: 12px;
  }

  .problema-item {
    border: 2px solid var(--gray-light);
    border-radius: 12px;
    padding: 18px 20px;
    cursor: pointer;
    background: var(--white);
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: all 0.2s;
  }

  .problema-item:hover {
    border-color: var(--blue-light);
    background: #f0f6ff;
  }

  .problema-item.selected {
    border-color: var(--blue-mid);
    background: var(--blue-pale);
  }

  .problema-check {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid var(--gray-light);
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-size: 12px;
    color: white;
  }

  .problema-item.selected .problema-check {
    background: var(--blue-mid);
    border-color: var(--blue-mid);
  }

  .problema-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
    font-weight: 400;
  }

  .problema-category {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--blue-light);
    margin-bottom: 12px;
    margin-top: 20px;
  }

  .problema-category:first-child { margin-top: 0; }

  .insight-block {
    background: var(--white);
    border-left: 4px solid var(--blue-mid);
    border-radius: 0 12px 12px 0;
    padding: 24px 28px;
    margin-bottom: 28px;
    box-shadow: 0 2px 12px rgba(30,58,110,0.06);
  }

  .insight-block p {
    font-size: 16px;
    line-height: 1.75;
    color: var(--text);
    font-weight: 300;
    font-style: italic;
  }

  .resultado-header {
    background: var(--blue-deep);
    border-radius: 16px;
    padding: 28px 32px;
    margin-bottom: 24px;
    color: white;
  }

  .resultado-header h3 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .resultado-header p {
    font-size: 14px;
    opacity: 0.8;
    font-weight: 300;
    line-height: 1.6;
  }

  .programas-list {
    display: grid;
    gap: 16px;
    margin-bottom: 32px;
  }

  .programa-card {
    background: var(--white);
    border-radius: 14px;
    border: 1px solid var(--gray-light);
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(30,58,110,0.06);
  }

  .programa-card-header {
    background: var(--blue-pale);
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--gray-light);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .programa-name {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--blue-deep);
    margin-bottom: 4px;
  }

  .programa-meta {
    font-size: 12px;
    color: var(--gray-text);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .programa-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .programa-badge {
    background: var(--blue-mid);
    color: white;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .programa-badge.accent {
    background: var(--accent);
  }

  .programa-card-body {
    padding: 20px 24px;
  }

  .programa-why {
    font-size: 14px;
    color: var(--text);
    line-height: 1.7;
    margin-bottom: 16px;
    font-weight: 300;
  }

  .programa-why strong {
    font-weight: 600;
    color: var(--blue-deep);
  }

  .precios-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--gray-text);
    margin-bottom: 10px;
  }

  .precios-grid {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .precio-item {
    background: var(--off-white);
    border: 1px solid var(--gray-light);
    border-radius: 10px;
    padding: 10px 14px;
    text-align: center;
    min-width: 110px;
  }

  .precio-label {
    font-size: 11px;
    color: var(--gray-text);
    font-weight: 500;
    margin-bottom: 3px;
  }

  .precio-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--blue-deep);
  }

  .precio-note {
    font-size: 10px;
    color: var(--gray-text);
    margin-top: 2px;
  }

  /* COMBO CARD */
  .combo-card {
    background: linear-gradient(135deg, var(--blue-deep) 0%, var(--blue-mid) 100%);
    border-radius: 14px;
    padding: 24px 28px;
    color: white;
    margin-top: 8px;
  }

  .combo-tag {
    display: inline-block;
    background: var(--accent);
    color: var(--white);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
    letter-spacing: 0.03em;
  }

  .combo-name {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .combo-desc {
    font-size: 13px;
    opacity: 0.85;
    margin-bottom: 16px;
    line-height: 1.6;
    font-weight: 300;
  }

  .combo-precios {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .combo-precio {
    background: rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 8px 12px;
    text-align: center;
    min-width: 90px;
  }

  .combo-precio-label { font-size: 11px; opacity: 0.75; margin-bottom: 2px; }
  .combo-precio-value { font-size: 15px; font-weight: 700; }

  /* CTA */
  .cta-section {
    background: var(--off-white);
    border: 2px solid var(--gray-light);
    border-radius: 16px;
    padding: 28px 32px;
    text-align: center;
    margin-top: 12px;
  }

  .cta-section h4 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--blue-deep);
    margin-bottom: 8px;
  }

  .cta-section p {
    font-size: 14px;
    color: var(--gray-text);
    margin-bottom: 20px;
    font-weight: 300;
    line-height: 1.6;
  }

  .cta-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-whatsapp {
    background: #25D366;
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: all 0.2s;
    box-shadow: 0 4px 14px rgba(37,211,102,0.3);
  }

  .btn-whatsapp:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(37,211,102,0.4);
  }

  .btn-email {
    background: var(--blue-deep);
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
  }

  .btn-email:hover {
    background: var(--blue-mid);
    transform: translateY(-2px);
  }

  /* NAV BUTTONS */
  .nav-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 36px;
    gap: 12px;
  }

  .btn-back {
    background: none;
    border: 2px solid var(--gray-light);
    color: var(--gray-text);
    padding: 12px 24px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-back:hover {
    border-color: var(--blue-light);
    color: var(--blue-mid);
  }

  .btn-next {
    background: var(--blue-mid);
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(45,95,166,0.3);
  }

  .btn-next:hover:not(:disabled) {
    background: var(--blue-deep);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(45,95,166,0.4);
  }

  .btn-next:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn-restart {
    background: none;
    border: 2px solid var(--gray-light);
    color: var(--gray-text);
    padding: 12px 20px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-restart:hover { border-color: var(--blue-light); color: var(--blue-mid); }

  .selected-count {
    font-size: 13px;
    color: var(--gray-text);
    font-weight: 300;
  }

  .selected-count strong {
    color: var(--blue-mid);
    font-weight: 600;
  }

  /* FOOTER */
  footer {
    background: var(--blue-deep);
    color: rgba(255,255,255,0.6);
    text-align: center;
    padding: 24px 32px;
    font-size: 13px;
    font-weight: 300;
  }

  footer a { color: var(--accent); text-decoration: none; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    main { padding: 32px 20px 60px; }
    .header-inner { padding: 28px 20px 36px; }
    .roles-grid { grid-template-columns: 1fr 1fr; }
    .steps-inner { gap: 0; }
    .step-label { display: none; }
    .precios-grid { flex-direction: column; }
    .combo-precios { flex-direction: column; }
    .cta-buttons { flex-direction: column; }
    .nav-actions { flex-wrap: wrap; }
  }


  /* RECURSOS */
  .recurso-wrapper { max-width: 680px; margin: 0 auto; }
  .recurso-header {
    background: #2c4c87;
    border-radius: 16px; padding: 28px 24px;
    margin-bottom: 8px; position: relative; overflow: hidden;
  }
  .recurso-header::before {
    content: ''; position: absolute;
    top: -50px; right: -50px;
    width: 180px; height: 180px;
    background: #2f64ac; opacity: 0.07; border-radius: 50%;
  }
  .recurso-header::after {
    content: ''; position: absolute;
    bottom: -30px; left: -30px;
    width: 120px; height: 120px;
    background: #5585c5; opacity: 0.05; border-radius: 50%;
  }
  .recurso-label {
    font-size: 10px; font-weight: 600;
    letter-spacing: 2.5px; text-transform: uppercase;
    color: #5585c5; margin-bottom: 12px;
  }
  .recurso-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 700;
    color: #ffffff; line-height: 1.3; margin-bottom: 10px;
  }
  .recurso-subtitulo { font-size: 14px; color: rgba(255,255,255,0.65); line-height: 1.6; }
  .dimensiones-container { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .dimension-item {
    background: #ffffff; border-radius: 12px;
    border: 1px solid #dde6f4; overflow: hidden;
    transition: box-shadow 0.2s ease;
  }
  .dimension-item:hover { box-shadow: 0 4px 20px rgba(47,100,172,0.1); }
  .dimension-header {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 18px 20px; cursor: pointer;
    user-select: none; gap: 12px;
  }
  .dimension-header-left { display: flex; align-items: center; gap: 14px; }
  .dimension-num {
    width: 28px; height: 28px; background: #eaf1fb;
    border-radius: 8px; display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 700;
    color: #2f64ac; flex-shrink: 0;
  }
  .dimension-item.open .dimension-num { background: #2f64ac; color: #ffffff; }
  .dimension-nombre { font-size: 14px; font-weight: 600; color: #2c4c87; line-height: 1.3; }
  .dimension-chevron {
    width: 20px; height: 20px; flex-shrink: 0;
    color: #8aa3c8; transition: transform 0.3s ease;
  }
  .dimension-item.open .dimension-chevron { transform: rotate(180deg); color: #2f64ac; }
  .dimension-body {
    display: none; padding: 0 20px 22px;
    border-top: 1px solid #dde6f4;
  }
  .dimension-item.open .dimension-body { display: block; animation: fadeInDim 0.3s ease; }
  @keyframes fadeInDim {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .dimension-intro {
    font-size: 14px; color: #4a6080;
    line-height: 1.7; padding-top: 18px; margin-bottom: 20px;
  }
  .practica-box {
    background: #eaf1fb; border-left: 3px solid #2f64ac;
    border-radius: 0 10px 10px 0; padding: 16px 18px;
  }
  .practica-label {
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: #2f64ac; margin-bottom: 10px;
  }
  .practica-texto { font-size: 13px; color: #1a2e50; line-height: 1.7; }
  .practica-texto p + p { margin-top: 10px; }

  /* LIDER/SUPERVISOR */
  .contenido-card {
    background: #ffffff; border-radius: 16px;
    border: 1px solid #dde6f4; padding: 28px 24px; margin-bottom: 8px;
  }
  .contenido-texto { font-size: 15px; color: #4a6080; line-height: 1.75; margin-bottom: 20px; }
  .contenido-texto p + p { margin-top: 14px; }
  .dimensiones-lista { background: #eaf1fb; border-radius: 12px; padding: 18px 20px; margin-bottom: 24px; }
  .dimensiones-label {
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: #2f64ac; margin-bottom: 12px;
  }
  .dimensiones-grid { display: flex; flex-direction: column; gap: 8px; }
  .dimension-tag { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #1a2e50; font-weight: 500; }
  .dimension-dot { width: 6px; height: 6px; background: #2f64ac; border-radius: 50%; flex-shrink: 0; }
  .btn-diagnostico {
    display: block; background: #2c4c87; color: #ffffff;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
    text-align: center; text-decoration: none;
    padding: 16px 20px; border-radius: 12px; transition: background 0.2s ease;
  }
  .btn-diagnostico:hover { background: #2f64ac; }
  .btn-nota { font-size: 12px; color: #8aa3c8; text-align: center; margin-top: 10px; line-height: 1.5; }

  /* CIERRE */
  .cierre-universal {
    background: #2c4c87; border-radius: 16px;
    padding: 28px 24px; margin: 24px 0;
  }
  .cierre-universal p {
    font-size: 16px; font-weight: 400; color: #daedf8; line-height: 1.7;
  }

  /* SIN DATOS */
  .sin-datos {
    background: #ffffff; border-radius: 16px;
    border: 2px solid #e8eef6; padding: 48px 32px;

function renderProblemas() {
  const container = document.getElementById('problemas-container');
  const items = PROBLEMAS[selectedRol] || [];
  container.innerHTML = items.map(p => `
    <div class="problema-item" id="prob-${p.id}" onclick="toggleProblema('${p.id}')">
      <div class="problema-check" id="check-${p.id}"></div>
      <div class="problema-text">${p.text}</div>
    </div>
  `).join('');
  updateCount();
}

function toggleProblema(id) {
  if (selectedProblemas.has(id)) {
    selectedProblemas.delete(id);
    document.getElementById('prob-' + id).classList.remove('selected');
    document.getElementById('check-' + id).innerHTML = '';
  } else {
    selectedProblemas.add(id);
    document.getElementById('prob-' + id).classList.add('selected');
    document.getElementById('check-' + id).innerHTML = '✓';
  }
  updateCount();
}

function updateCount() {
  const n = selectedProblemas.size;
  const display = document.getElementById('count-display');
  const btn = document.getElementById('btn-next-2');
  if (n === 0) {
    display.innerHTML = '';
    btn.disabled = true;
  } else {
    display.innerHTML = `<strong>${n}</strong> seleccionada${n > 1 ? 's' : ''}`;
    btn.disabled = false;
  }
}

function calcularRecomendaciones() {
  const scores = { velar: 0, aletheia: 0, mccr: 0, okr: 0, sinFiltro: 0, foundation: 0 };
  const items = PROBLEMAS[selectedRol] || [];

  selectedProblemas.forEach(id => {
    const item = items.find(p => p.id === id);
    if (!item) return;
    item.tags.forEach(tag => {
      Object.entries(PROGRAMA_SCORES).forEach(([prog, tags]) => {
        if (tags.includes(tag)) scores[prog]++;
      });
    });
  });

  // Sort by score, keep top relevant
  const sorted = Object.entries(scores)
    .filter(([, v]) => v > 0)
    .sort(([, a], [, b]) => b - a);

  // Primary = top scorer; secondary = next if relevant
  const primary = sorted[0]?.[0];
  const secondary = sorted[1]?.[1] >= 2 ? sorted[1]?.[0] : null;
  const tertiary = sorted[2]?.[1] >= 2 ? sorted[2]?.[0] : null;

  return { primary, secondary, tertiary, scores };
}

function getInsight(primary, secondary, tertiary) {
  const progs = [primary, secondary, tertiary].filter(Boolean);
  const has = (p) => progs.includes(p);

  // Sin Filtro solo
  if (progs.length === 1 && has('sinFiltro')) {
    return 'Lo que marcaste tiene nombre: hay conversaciones que no están funcionando. A veces parece que el problema es el otro, que no escucha, que no hace caso, que no entiende. Y puede ser. Pero muchas veces la conversación que creemos que estamos teniendo no es la que el otro está recibiendo. Eso no es un problema de personalidad ni de voluntad. Es falta de herramientas para decir lo que hay que decir, y que el otro lo interprete exactamente como necesitamos que lo interprete.';
  }
  // Solo VELAR
  if (progs.length === 1 && has('velar')) {
    return 'Lo que aparece en lo que marcaste tiene que ver con cómo te relacionás con las personas que te rodean en el trabajo. Cómo comunicás, cómo te perciben, cómo manejás lo que pasa antes de que explote. Eso no se resuelve con más información ni con otra metodología. Se resuelve trabajando sobre el observador que sos.';
  }
  // Solo ALETHEIA
  if (progs.length === 1 && has('aletheia')) {
    return 'Lo que describís no es un problema de conocimiento. Sabés lo que hay que hacer, pero algo en el sistema no termina de funcionar. Los patrones se repiten, los cambios no se sostienen, el equipo responde diferente a lo que esperás. Eso tiene una causa, y se puede intervenir con precisión.';
  }
  // Solo MCCR
  if (progs.length === 1 && has('mccr')) {
    return 'Lo que marcaste tiene un denominador común: hacen cosas, pero no está claro si esas cosas importan. Medir por medir no sirve. Lo que necesitás es un sistema que conecte el trabajo del día a día con lo que la organización realmente necesita lograr.';
  }
  // Solo OKR
  if (progs.length === 1 && has('okr')) {
    return 'Lo que describís muestra un equipo que trabaja sin una dirección compartida. Cada uno entiende las prioridades a su manera, y eso genera fricción, reprocesos y esfuerzo que no se traduce en resultados. Los OKRs bien construidos resuelven exactamente eso.';
  }
  // VELAR + ALETHEIA
  if (has('velar') && has('aletheia') && !has('mccr')) {
    return 'Lo que describís tiene dos dimensiones. Una es cómo te vinculás con el equipo: cómo te perciben, cómo comunicás, cómo influís sin necesitar autoridad formal. La otra es más profunda: los patrones que se repiten, los cambios que no se sostienen, el sistema que sigue funcionando igual aunque vos quieras que sea diferente. Las dos se trabajan juntas, y una potencia a la otra.';
  }
  // ALETHEIA + MCCR
  if (has('aletheia') && has('mccr') && !has('velar')) {
    return 'Lo que marcaste muestra dos problemas que suelen ir juntos. Por un lado, algo en el liderazgo o en la dinámica del equipo que no termina de funcionar. Por el otro, una desconexión entre lo que hacen y los resultados que la organización necesita ver. Trabajar solo uno sin el otro da resultados parciales.';
  }
  // VELAR + MCCR
  if (has('velar') && has('mccr') && !has('aletheia')) {
    return 'Lo que describís combina dos cosas que raramente se trabajan juntas. Cómo te relacionás y comunicás con las personas, y cómo medís si lo que están haciendo realmente importa. Son dos palancas distintas, pero cuando se mueven al mismo tiempo el cambio se siente en el equipo y en los números.';
  }
  // VELAR + ALETHEIA + MCCR
  if (has('velar') && has('aletheia') && has('mccr')) {
    return 'Lo que marcaste cubre bastante terreno. Hay algo en cómo te relacionás con el equipo, algo en los patrones que se repiten aunque intentés cambiarlos, y algo en la desconexión entre el esfuerzo y los resultados reales. No es un diagnóstico simple, pero tampoco es un problema sin solución. Hay un recorrido claro para trabajar todo esto de forma integrada.';
  }
  // Cualquier combinación con OKR
  if (has('okr') && progs.length > 1) {
    return 'Lo que describís muestra un equipo que necesita dos cosas a la vez: trabajar algunos patrones internos, y encontrar una dirección más clara que conecte el trabajo diario con lo que la organización realmente necesita lograr.';
  }
  return 'En base a lo que marcaste, estas son las formaciones que mejor se adaptan a tu contexto.';
}

function goToStep(n) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + n).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // Update steps bar
  for (let i = 1; i <= 3; i++) {
    const ind = document.getElementById('step' + i + '-indicator');
    ind.classList.remove('active', 'done');
    if (i < n) ind.classList.add('done');
    else if (i === n) ind.classList.add('active');
  }

  // Update done checkmarks
  document.querySelectorAll('.step-item.done .step-num').forEach(el => {
    if (!el.innerHTML.includes('✓')) el.innerHTML = '✓';
  });
}

// ===== TOGGLE ACORDEÓN =====
function toggleDim(id) {
  const item = document.getElementById(id);
  if (!item) return;
  const isOpen = item.classList.contains('open');
  document.querySelectorAll('.dimension-item').forEach(el => el.classList.remove('open'));
  if (!isOpen) {
    item.classList.add('open');
    setTimeout(() => item.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
  }
}

    blindspots: ["El alto nivel de coherencia puede generar expectativas muy elevadas en el equipo.","Existe riesgo de que tu claridad estratégica inhiba la emergencia de nuevas ideas.","El liderazgo en este nivel puede volverse solitario sin espacios de intercambio con pares."],
    description: "Este perfil refleja un liderazgo que ya no se mide solo por resultados propios, sino por la capacidad de multiplicar impacto en otros.",
    keep: ["Sostené la coherencia entre pensamiento, comunicación y acción.","Continuá generando entornos donde la exigencia y el cuidado de las personas son complementarios."],
    adjust: ["Revisá dónde todavía sostenés control sobre decisiones que ya podrían ser del equipo.","Generá explícitamente permiso para el error dentro del equipo."],
    start: ["Definí de forma consciente cuál es tu legado de liderazgo.","Construí sistemas que sostengan el funcionamiento del equipo más allá de tu presencia directa."],
    closing: "Liderar en este nivel es una responsabilidad que va más allá del rol. El desafío ya no es crecer vos, sino crear las condiciones para que otros crezcan."
  }
];

// Estado del diagnóstico embebido
let diagState = {
  currentSection: 0,
  answers: {},
  containerId: null
};

function initDiagnostico(containerId) {
  diagState = { currentSection: 0, answers: {}, containerId };
  renderDiagSection();
}

function renderDiagSection() {
  const container = document.getElementById(diagState.containerId);
  if (!container) return;
  const s = diagSections[diagState.currentSection];
  const totalQ = diagSections.reduce((a, sec) => a + sec.questions.length, 0);
  const doneQ = diagSections.slice(0, diagState.currentSection).reduce((a, sec) => a + sec.questions.length, 0);
  const pct = Math.round((doneQ / totalQ) * 100);

  let html = `
    <div class="diag-progress-label">Pregunta ${doneQ + 1}–${doneQ + s.questions.length} de ${totalQ}</div>
    <div class="diag-progress-wrap"><div class="diag-progress-fill" style="width:${pct}%"></div></div>
    <div class="diag-section-header">
      <div class="diag-section-num">Dimensión ${diagState.currentSection + 1} de ${diagSections.length}</div>
      <h3>${s.name}</h3>
      <p>${s.desc}</p>
    </div>
    <div class="diag-questions-card">
  `;

  s.questions.forEach((q, qi) => {
    const qKey = `${diagState.currentSection}-${qi}`;
    html += `<div class="diag-question-item">
      <div class="diag-question-num">Pregunta ${doneQ + qi + 1}</div>
      <div class="diag-question-text">${q}</div>
      <div class="diag-options-grid">`;
    diagOptions.forEach(opt => {
      const selected = diagState.answers[qKey] === opt.num ? 'selected' : '';
      html += `<button class="diag-option-btn ${selected}" onclick="diagSelectAnswer('${qKey}', ${opt.num}, this)">
        <span class="opt-num">${opt.num}</span>
        <span class="opt-label">${opt.label}</span>
      </button>`;
    });
    html += `</div></div>`;
  });

  html += `</div>
    <div class="diag-unanswered" id="diag-unanswered-${diagState.containerId}">Por favor respondé todas las preguntas antes de continuar.</div>
    <div class="diag-nav">
      <button class="diag-btn-prev" id="diag-prev-${diagState.containerId}" onclick="diagPrev()" style="${diagState.currentSection > 0 ? '' : 'display:none'}">← Anterior</button>
      <button class="diag-btn-next" onclick="diagNext()">${diagState.currentSection < diagSections.length - 1 ? 'Siguiente →' : 'Ver mi resultado →'}</button>
    </div>
  `;

  container.innerHTML = html;
}

function diagSelectAnswer(key, val, btn) {
  diagState.answers[key] = val;
  const grid = btn.parentElement;
  grid.querySelectorAll('.diag-option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('diag-unanswered-' + diagState.containerId).style.display = 'none';
}

function diagAllAnswered() {
  const s = diagSections[diagState.currentSection];
  for (let qi = 0; qi < s.questions.length; qi++) {
    if (diagState.answers[`${diagState.currentSection}-${qi}`] === undefined) return false;
  }
  return true;
}

function diagNext() {
  if (!diagAllAnswered()) {
    document.getElementById('diag-unanswered-' + diagState.containerId).style.display = 'block';
    return;
  }
  if (diagState.currentSection < diagSections.length - 1) {
    diagState.currentSection++;
    renderDiagSection();
    document.getElementById(diagState.containerId).scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    showDiagResults();
  }
}

function diagPrev() {
  if (diagState.currentSection > 0) {
    diagState.currentSection--;
    renderDiagSection();
  }
}

function diagCalcScores() {
  return diagSections.map((s, si) => {
    let total = 0;
    s.questions.forEach((_, qi) => { total += diagState.answers[`${si}-${qi}`] || 0; });
    return { name: s.name, score: total, max: s.questions.length * 4 };
  });
}

function diagGetProfile(total) {
  return diagProfiles.find(p => total >= p.range[0] && total <= p.range[1]) || diagProfiles[diagProfiles.length - 1];
}

function showDiagResults() {
  const dimScores = diagCalcScores();
  const total = dimScores.reduce((a, d) => a + d.score, 0);
  const max = diagSections.reduce((a, s) => a + s.questions.length, 0) * 4;
  const profile = diagGetProfile(total);
  const container = document.getElementById(diagState.containerId);

  container.innerHTML = `
    <div class="diag-result-header">
      <div class="diag-result-tag">Tu resultado</div>
      <h2>${profile.headline}</h2>
      <div class="diag-profile-name">Perfil: ${profile.name}</div>
      <div class="diag-total-score">Puntaje total<strong>${total} / ${max}</strong></div>
    </div>

    <div class="diag-scores-card">
      <h3>Resultados por dimensión</h3>
      ${dimScores.map(d => `
        <div class="diag-dim-item">
          <div class="diag-dim-header">
            <span class="diag-dim-name">${d.name}</span>
            <span class="diag-dim-val">${d.score} / ${d.max}</span>
          </div>
          <div class="diag-dim-bar"><div class="diag-dim-bar-fill" style="width:${Math.round((d.score/d.max)*100)}%"></div></div>
        </div>
      `).join('')}
    </div>

    <div class="diag-profile-card">
      <div class="diag-intro-quote">"Este diagnóstico no define quién sos como líder, sino cómo estás liderando hoy. El valor está en lo que elijas revisar y ajustar a partir de ahora."</div>
      <div class="diag-profile-section">
        <h4>Fortalezas principales</h4>
        <ul class="diag-profile-list">${profile.strengths.map(s => `<li>${s}</li>`).join('')}</ul>
      </div>
      <div class="diag-profile-section">
        <h4>Áreas de desarrollo</h4>
        <ul class="diag-profile-list">${profile.blindspots.map(s => `<li>${s}</li>`).join('')}</ul>
      </div>
      <div class="diag-profile-section">
        <h4>Tu perfil</h4>
        <p style="font-size:14px;line-height:1.7;color:#4a6080">${profile.description}</p>
      </div>
      <div class="diag-profile-section">
        <h4>Claves para evolucionar tu liderazgo</h4>
        <div class="diag-evolution-grid">
          <div class="diag-evolution-block"><h5>Qué mantener</h5><ul>${profile.keep.map(s => `<li>${s}</li>`).join('')}</ul></div>
          <div class="diag-evolution-block"><h5>Qué ajustar</h5><ul>${profile.adjust.map(s => `<li>${s}</li>`).join('')}</ul></div>
          <div class="diag-evolution-block"><h5>Qué empezar a hacer</h5><ul>${profile.start.map(s => `<li>${s}</li>`).join('')}</ul></div>
        </div>
      </div>
      <div class="diag-profile-closing">${profile.closing}</div>
    </div>
  `;

  // Animar barras
  setTimeout(() => {
    container.querySelectorAll('.diag-dim-bar-fill').forEach(bar => {
      const w = bar.style.width;
      bar.style.width = '0';
      setTimeout(() => { bar.style.width = w; }, 100);
    });
  }, 200);

  // Mostrar formaciones después del diagnóstico
  setTimeout(() => {
    showFormacionesDespuesDiag();
  }, 500);
}

function showFormacionesDespuesDiag() {
  const { primary, secondary, tertiary } = calcularRecomendaciones();
  const insight = getInsight(primary, secondary, tertiary);
  let programasHTML = buildProgramaCard(primary, true);
  if (secondary && secondary !== primary) programasHTML += buildProgramaCard(secondary, false);
  if (tertiary && tertiary !== primary && tertiary !== secondary) programasHTML += buildProgramaCard(tertiary, false);
  const comboHTML = buildComboSugerido(primary, secondary, tertiary);

  const formDiv = document.createElement('div');
  formDiv.style.animation = 'fadeUp 0.4s ease both';
  formDiv.innerHTML = `
    <div class="cierre-universal">
      <p>Lo que encontraste acá es el diagnóstico. El trabajo real empieza después. Mis formaciones están diseñadas para que dejes de reconocer los problemas y empieces a resolverlos, para que crezcas en tu rol y generes un impacto que se vea en los resultados de tu equipo.</p>
    </div>
    <div class="insight-block" style="margin-top:8px;">
      <p>${insight}</p>
    </div>
    <div class="programas-list">
      ${programasHTML}
      ${comboHTML ? `<div>${comboHTML}</div>` : ''}
    </div>
    <div class="cta-section">
      <h4>¿Te identificaste? Hablemos.</h4>
      <p>Contanos tu situación. Sin presentaciones, sin compromiso.</p>
      <div class="cta-buttons">
        <a href="https://wa.me/message/OY2XJPLGZKXMJ1" target="_blank" class="btn-whatsapp">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
          Hablar por WhatsApp
        </a>
      </div>
    </div>
    <div style="text-align:center; margin-top:32px; padding-bottom:32px;">
      <a href="index.html" style="font-size:13px; color:var(--gray-text); text-decoration:none;">← Volver al inicio</a>
    </div>
  `;

  // Agregar después del contenedor del diagnóstico
  const diagContainer = document.getElementById(diagState.containerId);
  if (diagContainer && diagContainer.parentNode) {
    diagContainer.parentNode.appendChild(formDiv);
    setTimeout(() => {
      formDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 300);
  }
}

// Ejecutar al cargar
init();
</script>
